plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    // jar name: <mod name>-<mc ver>-<mod ver>; e.g. test-1.21-1.0.0.jar
    archivesName = "${project.archives_base_name}-${project.minecraft_version}"
}

repositories {
    maven { url 'https://maven.terraformersmc.com/releases/' }
    maven { url 'https://maven.isxander.dev/releases' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    modImplementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"
}

processResources {
    var properties = project.properties.clone()

    filesMatching("fabric.mod.json") {
        expand properties as Map<String, ?>
    }
}

def javaVersion = 21

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(javaVersion)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
}
