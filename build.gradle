plugins {
	id "net.fabricmc.fabric-loom" version "${fabric_loom_version}"
}

def templateVersionKeys = [
	"java_version",
	"minecraft_version",
	"fabric_loader_version",
	"fabric_api_version",
	"modmenu_version",
	"yacl_version",
]
def templateProperties = new LinkedHashMap<String, String>(providers.gradlePropertiesPrefixedBy("mod_").get())
templateVersionKeys.each { key -> templateProperties.put(key, providers.gradleProperty(key).get()) }

repositories {
	def modrinth = maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
	
	exclusiveContent {
		forRepositories(modrinth)
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
	implementation "maven.modrinth:modmenu:${modmenu_version}"
	implementation "maven.modrinth:yacl:${yacl_version}"
	
	testImplementation "net.fabricmc:fabric-loader-junit:${fabric_loader_version}"
}

// Files with ${...} live in src/main/templates and are generated into build/generated/templates.
def generatedJavaDir = layout.buildDirectory.dir("generated/templates/java")
def generatedResourcesDir = layout.buildDirectory.dir("generated/templates/resources")

def generateTemplateSources = tasks.register("generateTemplateSources", Sync) {
	inputs.properties(templateProperties)
	
	from("src/main/templates/java") {
		into("${mod_group}.${mod_package}".replace(".", "/"))
	}
	into(generatedJavaDir)
	expand(templateProperties)
}

def generateTemplateResources = tasks.register("generateTemplateResources", Sync) {
	inputs.properties(templateProperties)
	
	from("src/main/templates/resources")
	into(generatedResourcesDir)
	expand(templateProperties)
}

sourceSets.main.java.srcDir(files(generatedJavaDir).builtBy(generateTemplateSources))
sourceSets.main.resources.srcDir(files(generatedResourcesDir).builtBy(generateTemplateResources))

// Generate on IntelliJ Gradle sync too, so ModInfo isn't red before the first build.
tasks.matching { it.name == "ideaSyncTask" }.configureEach {
	dependsOn(generateTemplateSources, generateTemplateResources)
}

jar {
	archiveFileName.set("${mod_id}-v${mod_version}+mc${minecraft_version}-fabric.jar")
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

// Fabric Loader JUnit pollutes the working directory, so keep them inside build/.
def testRunDir = layout.buildDirectory.dir("test-run")

test {
	useJUnitPlatform()
	workingDir = testRunDir.get().asFile
	
	doFirst {
		testRunDir.get().asFile.mkdirs()
	}
}
